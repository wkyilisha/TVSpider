name: Spider Jar Gen (Fast & Stable)

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Custom Spider Jar
        run: ./gradlew app:buildCustomSpiderJar --parallel --daemon --build-cache

      - name: Commit Jar & JSON to repo (no pull)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add ./jar/custom_spider.jar ./jar/custom_spider.jar.md5 ./json/index.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi
          
          git commit -m "update spider jar and json"
          git push origin multiThread

      - name: Find Jar path
        id: find_jar
        run: |
          JAR_PATH="./jar/custom_spider.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          else
            BUILT_JAR=$(find . -name "custom_spider.jar" -type f | head -1)
            if [ -n "$BUILT_JAR" ]; then
              echo "JAR_PATH=$BUILT_JAR" >> $GITHUB_OUTPUT
            else
              echo "::error::Jar file not found after build."
              exit 1
            fi
          fi

      - name: Upload Jar Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar
          path: ${{ steps.find_jar.outputs.JAR_PATH }}
          retention-days: 7
