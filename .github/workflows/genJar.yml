name: Spider Jar Gen (Optimized)

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 关键优化1：开启 Gradle 并行、守护进程，开启构建缓存
      - name: Build Custom Spider Jar
        run: ./gradlew app:buildCustomSpiderJar --parallel --daemon --build-cache

      - name: Add & Commit Jar and JSON
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5
            ./json/index.json
          # 关键优化2：禁用拉取，减少网络操作
          pull: false

      - name: Find Jar path
        id: find_jar
        run: |
          JAR_PATH="./jar/custom_spider.jar"
          if [ -f "$JAR_PATH" ]; then
            echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          else
            BUILT_JAR=$(find . -name "custom_spider.jar" -type f | head -1)
            if [ -n "$BUILT_JAR" ]; then
              echo "JAR_PATH=$BUILT_JAR" >> $GITHUB_OUTPUT
            else
              echo "::error::Jar file not found after build."
              exit 1
            fi
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Spider-Jar
          path: ${{ steps.find_jar.outputs.JAR_PATH }}
          retention-days: 7
